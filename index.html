<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site English</title>
<meta name="theme-color" content="#0E6B4A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Site English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root{--green:#0E6B4A;--mark:#F2B705;--ink:#10222E}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--green);color:#fff;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Sarabun","Noto Sans Thai",sans-serif;
       display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 24px)}
  .card{width:100%;max-width:420px;text-align:center}
  .card img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
  h1{font-size:26px;margin:16px 0 4px}
  .sub{opacity:.85;margin:0 0 20px}
  .msg{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:14px 16px;text-align:left;font-size:15px}
  .msg b{color:var(--mark)}
  .btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;margin-top:16px;border-radius:12px;border:0;
       background:var(--mark);color:var(--ink);font:700 16px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.3);border-top-color:var(--mark);border-radius:50%;margin:8px auto 0;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spin{animation:none}}
  code{background:rgba(0,0,0,.25);padding:1px 6px;border-radius:6px;word-break:break-all}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
  .full{position:fixed;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 86px);z-index:5;
        min-height:40px;padding:6px 14px;border-radius:999px;border:0;background:rgba(16,34,46,.88);color:#fff;font:600 14px inherit;font-family:inherit;
        text-decoration:none;display:inline-flex;align-items:center;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .4s}
  .full.dim{opacity:0;pointer-events:none}
  [hidden]{display:none!important}
</style>
</head>
<body>
<script>
/* ╔════════════════════════════════════════════════════════════════╗
 * ║  ⚙️  ตั้งค่า (CONFIG) — แก้ 2 บรรทัดนี้เท่านั้น                        ║
 * ║  ⚠️ อัปโหลด index.html ใหม่ทับ → ต้องกรอก EXEC_URL ใหม่ทุกครั้ง        ║
 * ╚════════════════════════════════════════════════════════════════╝ */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxEZtmvZDSyRwJXkUFaMTDQSw2IFRIGFLaQkvNglunK2kjp9a0IEBLbLwnEuZOCdd4SZA/exec';          // ← วางลิงก์เว็บแอปที่ลงท้ายด้วย /exec (Deploy › Manage deployments)
var OPEN_MODE = 'auto';     // 'auto' (แนะนำ) · 'iframe' = ฝังในหน้านี้เสมอ · 'redirect' = เปลี่ยนไปหน้าเว็บแอปเสมอ
/* ═════════════════════════ จบส่วนตั้งค่า ═════════════════════════ */
</script>
<main class="card" aria-live="polite">
  <img src="icons/icon-512.png" alt="">
  <h1>Site English</h1>
  <p class="sub">ฝึกสื่อสารงานทางหลวงเป็นภาษาอังกฤษ</p>
  <div id="opening"><p style="margin:0">กำลังเปิดแอป…</p><div class="spin" aria-hidden="true"></div>
    <a class="btn" id="openBtn" href="#" hidden>เปิดแอป</a></div>
  <div class="msg" id="offline" hidden><b>ยังไม่มีอินเทอร์เน็ต</b><br>ต่อ Wi-Fi หรือเน็ตมือถือ แล้วกดลองอีกครั้ง<br><button class="btn" type="button" id="retry">ลองอีกครั้ง</button></div>
  <div class="msg" id="setup" hidden><b>ยังไม่ได้ตั้งค่าลิงก์เว็บแอป</b><br>
    เปิดไฟล์ <code>index.html</code> ใน GitHub แล้ววางลิงก์ที่ลงท้ายด้วย <code>/exec</code> ในบรรทัด <code>EXEC_URL</code> ด้านบนสุด จากนั้นบันทึก (Commit) แล้วรอ 1–2 นาที</div>
</main>
<script>
(function(){
  var $=function(id){return document.getElementById(id);};
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(e){ console.error('SW register failed', e); }); }
  function show(id){ ['opening','offline','setup'].forEach(function(x){ $(x).hidden=(x!==id); }); }
  /* Safari (iPhone / iPad / Mac) บล็อกการล็อกอิน Google ในกรอบ → ใช้แบบเปลี่ยนหน้า · เบราว์เซอร์อื่นฝังในหน้านี้ */
  function isSafari(){
    var ua=navigator.userAgent||'';
    var ios=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
    return ios||(/Safari/.test(ua)&&!/Chrome|Chromium|CriOS|FxiOS|Edg|OPR|Android/.test(ua));
  }
  var READY_MS=9000;   /* เวลารอเว็บแอปในกรอบ (มิลลิวินาที) */
  /* จำผลครั้งก่อน: เครื่องนี้ฝังไม่ได้ (เช่น Chrome บล็อกคุกกี้บุคคลที่สาม) → ครั้งต่อไปเปิดแบบเต็มหน้าทันที ไม่ต้องรอ
   * จำไว้ 7 วัน แล้วลองฝังใหม่อีกครั้งเผื่อเปลี่ยนการตั้งค่าเบราว์เซอร์ */
  var MEMO_KEY='se_open_mode', MEMO_DAYS=7;
  function memo(){ try{ var m=JSON.parse(localStorage.getItem(MEMO_KEY)||'null'); return (m&&Date.now()-m.t<MEMO_DAYS*864e5)?m.v:''; }catch(e){ return ''; } }
  function setMemo(v){ try{ localStorage.setItem(MEMO_KEY,JSON.stringify({v:v,t:Date.now()})); }catch(e){} }
  function useIframe(){ return OPEN_MODE==='iframe'||(OPEN_MODE==='auto'&&!isSafari()&&memo()!=='redirect'); }
  function open(){
    if(!/^https:\/\/script\.google\.com\/.+\/exec(\?.*)?$/.test(EXEC_URL)){ show('setup'); return; }
    if(!navigator.onLine){ show('offline'); return; }
    show('opening');
    var url=EXEC_URL;
    $('openBtn').href=url;
    if(useIframe()){
      var f=document.createElement('iframe'); f.src=url; f.title='Site English';
      f.setAttribute('allow','microphone; autoplay; clipboard-write');
      f.style.visibility='hidden';   /* ซ่อนไว้จนเว็บแอปแจ้งว่าเปิดสำเร็จ — ผู้ใช้จะไม่เห็นหน้า error ของ Google */
      document.body.appendChild(f);
      /* ทางหนีไฟ: ถ้าในกรอบขึ้นหน้าล็อกอินไม่ผ่านหรือหน้าว่าง กดเปิดแบบเต็มหน้าได้ (ซ่อนเองหลัง 12 วินาที) */
      var a=document.createElement('a'); a.className='full'; a.href=url; a.textContent='เปิดแบบเต็มหน้า';
      a.onclick=function(e){ e.preventDefault(); location.replace(url); };
      document.body.appendChild(a);
      /* รอสัญญาณ "เปิดสำเร็จ" จากเว็บแอป · ไม่มาภายในเวลา (ยังไม่ล็อกอิน / เบราว์เซอร์บล็อกคุกกี้ในกรอบ / Google ตอบ 401)
       * → เปลี่ยนไปเปิดแบบเต็มหน้าเอง ผู้ใช้ไม่ต้องเจอหน้าว่างหรือหน้า error */
      var ready=false, timer=setTimeout(function(){ if(!ready){ if(OPEN_MODE==='auto') setMemo('redirect'); location.replace(url); } }, READY_MS);
      window.addEventListener('message', function(ev){
        if(ev.data!=='site-english:ready') return;
        if(!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(ev.origin)&&ev.origin!==location.origin) return;
        ready=true; clearTimeout(timer); f.style.visibility='visible'; setMemo('iframe'); setTimeout(function(){ a.className='full dim'; }, 4000);
      });
      return;
    }
    /* redirect: เปิดเว็บแอปแทนหน้านี้ (ไม่เก็บหน้านี้ในประวัติ กดย้อนกลับจะไม่วนมาหน้านี้) */
    setTimeout(function(){ location.replace(url); }, 250);
    setTimeout(function(){ $('openBtn').hidden=false; }, 4000);   /* เผื่อเบราว์เซอร์บล็อกการเปลี่ยนหน้าอัตโนมัติ */
  }
  $('retry').onclick=open;
  window.addEventListener('online', function(){ if(!$('offline').hidden) open(); });
  window.SE_PWA={open:open};
  open();
})();
</script>
</body>
</html>
