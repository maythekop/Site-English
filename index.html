<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B4A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Site English">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
#seGate{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 16px calc(env(safe-area-inset-bottom,0px) + 20px)}
#seGate[hidden]{display:none}
#seGate .g-in{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 20px;text-align:center}
#seGate img{width:84px;height:84px;border-radius:20px}
#seGate h2{margin:12px 0 4px}
#seGate p{margin:0 0 14px;color:var(--muted);font-size:15px}
#seGate label{display:block;text-align:left;font-size:14px;margin:0 0 6px}
#seGate input{width:100%;min-height:48px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel-2);color:var(--text);font:600 18px var(--font-th);padding:8px 12px;letter-spacing:.06em}
#seGate .g-err{color:var(--bad);min-height:22px;font-size:14px;margin:8px 0 0;text-align:left}
#seGate .btn{width:100%;margin-top:12px}
</style>

<title>Site English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== โทเคนสี: ธีม "ถนนยางมะตอย + ป้ายแนะนำทางสีเขียว + สีตีเส้นเหลือง" ===== */
:root{
  --bg:#22303A; --panel:#2C3C47; --panel-2:#354855; --line:#44596A;
  --text:#EEF1EE; --muted:#B9C3C6; --sign:#0E6B4A; --sign-ink:#FFFFFF;
  --mark:#F2B705; --mark-ink:#1D2A31; --ok:#3FBF7F; --bad:#FF7A6B; --user:#1F5C7A;
  --font-th:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;
  --font-sign:'Barlow Condensed','Arial Narrow','Sarabun',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#E6E4DE; --panel:#FFFFFF; --panel-2:#F1F0EC; --line:#CFCBC1;
    --text:#1D2A31; --muted:#56646B; --user:#D6EAF3; --mark-ink:#1D2A31;
  }
}
:root[data-theme="dark"]{
  --bg:#22303A; --panel:#2C3C47; --panel-2:#354855; --line:#44596A;
  --text:#EEF1EE; --muted:#B9C3C6; --user:#1F5C7A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font-th);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== แถบหัว ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.kmpost{flex:none;width:46px;border-radius:8px 8px 3px 3px;background:#fff;color:#1D2A31;text-align:center;overflow:hidden;box-shadow:0 0 0 1px var(--line)}
.kmpost b{display:block;background:var(--sign);color:#fff;font:600 11px/18px var(--font-sign);letter-spacing:.04em}
.kmpost span{display:block;font:700 22px/28px var(--font-sign)}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font:700 22px/1.1 var(--font-sign);letter-spacing:.01em}
.brand p{margin:0;font-size:13px;color:var(--muted)}
.xp{font:600 15px var(--font-sign);color:var(--mark);white-space:nowrap}
.guide-btn{display:flex;align-items:center;gap:6px;border:1.5px solid var(--mark);background:transparent;color:var(--mark);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;white-space:nowrap}
.guide-btn svg{width:18px;height:18px}

/* ===== พื้นที่เนื้อหา ===== */
main{max-width:760px;margin:0 auto;padding:18px 16px 110px}
h2{font:700 26px/1.15 var(--font-sign);margin:0 0 6px}
h3{font-size:17px;margin:22px 0 8px}
.lead{color:var(--muted);margin:0 0 16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.demo-note{font-size:13px;color:var(--muted);border-left:3px solid var(--mark);padding:4px 10px;margin:14px 0}
.en{font-family:var(--font-th);font-size:16.5px}

/* ปุ่ม */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;padding:10px 16px;font-weight:600;border:1.5px solid var(--line);background:var(--panel-2);min-height:44px}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--mark);border-color:var(--mark);color:var(--mark-ink)}
.btn.busy{opacity:.6;cursor:wait}
.btn.done{background:var(--ok);border-color:var(--ok);color:#10261B}
.btn.live{background:var(--bad);border-color:var(--bad);color:#2A0E0A}
.vol{display:flex;align-items:center;gap:10px;margin-top:10px;max-width:420px}
.vol-meter{flex:1;display:flex;align-items:center;gap:10px;min-width:0}
.vol-label{font-size:14px;color:var(--muted);white-space:nowrap}
.vol-bar{flex:1;height:8px;border-radius:4px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;min-width:60px}
.vol-bar i{display:block;height:100%;background:var(--mark);transition:width .15s}
#volVal{font:600 15px var(--font-sign);min-width:56px;text-align:right;white-space:nowrap}
.icon-btn:disabled,.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel-2);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* ===== ป้ายแนะนำทาง (จุดเด่นของหน้า) ===== */
.sign{background:var(--sign);color:var(--sign-ink);border-radius:14px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.sign-in{border:3px solid #fff;border-radius:10px;padding:18px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.sign-arrow{grid-row:span 2;width:58px;height:58px}
.sign-title{font:700 clamp(30px,7vw,44px)/1 var(--font-sign);letter-spacing:.01em}
.sign-sub{font-size:15px;opacity:.95}
.sign-meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding-top:10px;border-top:2px solid rgba(255,255,255,.35);font-size:14px}
.sign-meta span{background:rgba(0,0,0,.18);border-radius:6px;padding:2px 8px}

/* คำศัพท์ */
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.term{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;gap:10px;align-items:flex-start}
.term div{flex:1;min-width:0}
.term strong{display:block;font:600 19px/1.2 var(--font-sign)}
.term small{color:var(--muted);font-size:14px}

/* คำถามแบบเลือกตอบ */
.q{margin:12px 0}
.q p{margin:0 0 8px;font-weight:600}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:10px 12px;min-height:44px}
.opt.right{border-color:var(--ok);background:rgba(63,191,127,.18)}
.opt.wrong{border-color:var(--bad);background:rgba(255,122,107,.15)}
.explain{font-size:14px;color:var(--muted);margin-top:6px}

/* ===== แชท ===== */
.persona{display:flex;gap:12px;align-items:center}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--sign);display:flex;align-items:center;justify-content:center;font:700 20px var(--font-sign);color:#fff;flex:none;border:2px solid #fff}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.persona b{display:block}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel-2);color:var(--text);min-height:40px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--mark);color:#1D2A31;font-weight:700}
.seg-lbl{font-size:14px;color:var(--muted);margin-right:6px}
/* โหมดภาษาเนื้อหา · ข้อความไทยใช้ฟอนต์ไทยและระยะบรรทัดที่ไม่ตัดสระบน/ล่าง */
.lang-bar{margin:0 0 12px;gap:6px}
.lang-bar .seg{margin-top:0}
.lang-hint{flex:1 1 220px;margin:0}
.sign-title.th{font:700 clamp(24px,5.6vw,34px)/1.35 var(--font-th)}
.term strong.th{font:600 17px/1.4 var(--font-th)}
.th-sum{font-size:17px;line-height:1.8}
.sh-words .w{padding:1px 2px;border-radius:3px}.sh-words .ok{background:rgba(63,191,127,.22)}.sh-words .miss{background:rgba(226,88,74,.22);text-decoration:underline dotted}
.ls-list{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px;max-height:260px;overflow:auto}
.ls-list li{padding:6px 10px;border-radius:8px;font-size:14px;border:1px solid transparent}
.ls-list li.now{border-color:var(--mark);background:var(--panel-2);font-weight:600}
.em-model{white-space:pre-wrap}
.cefr{display:flex;gap:12px;align-items:center}
.cefr .lv{flex:none;width:56px;height:56px;border-radius:12px;background:var(--sign);color:#fff;display:flex;align-items:center;justify-content:center;font:700 22px var(--font-sign)}
.mk{margin:10px 0;padding:10px 12px;border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:0 8px 8px 0;background:var(--panel-2);font-size:14px}
.mk ul{margin:6px 0 0;padding-left:18px}.mk li{margin:3px 0}.mk s{color:var(--bad)}.mk small{color:var(--muted)}
.ai-warn{border-left:4px solid var(--mark);padding:6px 10px;background:var(--panel-2);font-size:14px;margin:8px 0}
.mkbook{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mkbook li{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel)}
.mkbook .mk-t{min-width:0}.mkbook s{color:var(--bad)}.mkbook small{display:block;color:var(--muted);font-size:13px}
.tw{cursor:pointer;border-bottom:1.5px dotted var(--mark);border-radius:2px}
.tw:hover,.tw:focus-visible{background:rgba(242,183,5,.18)}
.tw.busy{opacity:.5}.tw.saved{background:rgba(63,191,127,.22);border-bottom-color:var(--ok)}
.stage.flat{height:auto;min-height:0;padding:100px 8px 10px}
.hw2d svg{display:block;width:100%;height:auto}
.hw2d .seg-now.grow{animation:seg-grow .7s ease-out}
@keyframes seg-grow{0%{opacity:.3}60%{opacity:1}100%{opacity:1}}
/* แจ้งผลสั้น ๆ (บันทึกผล/XP) — อยู่เหนือแถบเมนูล่าง */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 78px);z-index:40;max-width:min(92vw,560px);background:#10222E;color:#fff;border:1px solid var(--mark);border-radius:10px;padding:10px 14px;font-size:14px;line-height:1.5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast.bad{border-color:var(--bad)}
.xp.pulse{animation:xp-pulse .6s ease}
@keyframes xp-pulse{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.tasks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.tasks .t-lbl{font-size:14px;color:var(--muted);margin-right:2px}
.tasks .t{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:14px;background:var(--panel-2)}
.tasks .t svg{width:16px;height:16px}
.tasks .t.done{border-color:var(--ok);color:var(--text)}
.tasks .t.done svg{color:var(--ok)}
.tasks .t:not(.done) svg{opacity:.35}
[data-speak][aria-pressed="true"]{border-color:var(--mark)}
/* ภาพที่ปรึกษา (ออกแบบใหม่ของแอป) · สถานะ: idle / speaking / listening / thinking */
.liam{width:112px;height:90px;flex:none;overflow:visible}
.liam .l-open,.liam .l-o,.liam .l-mid,.liam .l-wave,.liam .l-dots,.liam .l-hand{opacity:0;transition:opacity .2s}
.liam .l-brows path{transform-box:fill-box;transform-origin:50% 50%;transition:transform .3s}
.liam .l-smile{transition:opacity .15s}
.liam .l-body{transform-box:fill-box;transform-origin:50% 100%;animation:l-breathe 4.2s ease-in-out infinite}
.liam .l-head{transform-box:fill-box;transform-origin:50% 92%;transition:transform .35s}
.liam .l-eyes{transform-box:fill-box;transform-origin:50% 50%;animation:l-blink 5s infinite}
.liam.speaking .l-smile{opacity:0}
/* พูด: สลับรูปปาก 3 แบบตามจังหวะ (ลดการเคลื่อนไหว = ค้างที่ปากเปิด) */
.liam.speaking .l-open{opacity:1;animation:l-v1 .66s steps(1) infinite}
.liam.speaking .l-o{animation:l-v2 .66s steps(1) infinite}
.liam.speaking .l-mid{animation:l-v3 .66s steps(1) infinite}
.liam.listening .l-brows path{transform:translateY(-1.6px)}
.liam.thinking .l-brow-r{transform:translateY(-2px) rotate(-8deg)}
.liam.thinking .l-hand{opacity:1}
.liam.thinking .l-head{transform:rotate(3deg)}
.liam.speaking .l-wave{opacity:1}
.liam.speaking .l-wave path{animation:l-wave 1.1s ease-out infinite}
.liam.speaking .l-wave path+path{animation-delay:.35s}
.liam.speaking .l-head{animation:l-bob 1.4s ease-in-out infinite}
.liam.listening .l-head{transform:rotate(-6deg);animation:l-nod 1.8s ease-in-out infinite}
.liam.thinking .l-dots{opacity:1}
.liam.thinking .l-dots circle{animation:l-dot 1s ease-in-out infinite}
.liam.thinking .l-dots circle:nth-child(2){animation-delay:.15s}
.liam.thinking .l-dots circle:nth-child(3){animation-delay:.3s}
.liam.thinking .l-eyes{transform:translate(1.5px,-1.5px)}
.liam-state{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:13px;color:var(--muted)}
.liam-state i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.persona.speaking .liam-state i{background:var(--ok)}
.persona.listening .liam-state i{background:var(--mark)}
.persona.thinking .liam-state i{background:#7FB3E0}
@keyframes l-breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
@keyframes l-blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes l-v1{0%{opacity:1}33%{opacity:0}100%{opacity:0}}
@keyframes l-v2{0%{opacity:0}33%{opacity:1}66%{opacity:0}100%{opacity:0}}
@keyframes l-v3{0%{opacity:0}66%{opacity:1}100%{opacity:1}}
@keyframes l-wave{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
@keyframes l-bob{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes l-nod{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(1.5px)}}
@keyframes l-dot{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.persona small{color:var(--muted)}
.chat{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;position:relative}
.msg.them{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-top-left-radius:3px}
.msg.me{align-self:flex-end;background:var(--user);border-top-right-radius:3px}
.msg .who{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:2px}
.msg .icon-btn{width:32px;height:32px}
.fb{align-self:flex-end;max-width:88%;background:var(--panel-2);border:1px dashed var(--mark);border-radius:10px;padding:10px 12px;font-size:14px}
.fb b{color:var(--mark)}
.fb ul{margin:6px 0 0;padding-left:18px}
.typing{align-self:flex-start;color:var(--muted);font-size:14px}
.composer{position:sticky;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--bg);padding:10px 0 4px}
textarea{width:100%;min-height:84px;resize:vertical;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--text);padding:10px 12px;font:inherit}
.hint{background:var(--panel-2);border-radius:8px;padding:10px 12px;font-size:15px;margin-top:8px}
.status{font-size:13px;color:var(--bad);min-height:1.2em;margin-top:4px}

/* ===== คะแนนเกม ===== */
.bars{display:grid;gap:10px;margin:12px 0}
.bar label{display:flex;justify-content:space-between;font-size:14px}
.track{height:10px;background:var(--panel-2);border-radius:5px;overflow:hidden}
.fill{height:100%;background:var(--mark);width:0;transition:width .6s}
.model{background:var(--panel-2);border-left:4px solid var(--sign);border-radius:6px;padding:10px 12px}

/* ===== คู่มือย่อ ===== */
.steps{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.steps .n{width:44px;height:44px;border-radius:8px;background:var(--mark);color:var(--mark-ink);font:700 24px/44px var(--font-sign);text-align:center}
.steps b{display:block}
.steps span{color:var(--muted);font-size:15px}

/* คลังศัพท์ */
.deck{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.card-top{display:flex;gap:10px;align-items:center}
.card-top div{flex:1;min-width:0}
.card-top strong{font:600 20px/1.2 var(--font-sign)}
.card p{margin:6px 0;font-size:15px}
.due{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.seg .btn{min-height:38px;padding:6px 12px;font-size:14px}
.seg .btn[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:#fff}


/* ===== หมวดหมู่ / สายเนื้อหา / คลังเรื่อง ===== */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--c);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600;background:var(--panel)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip small{font-weight:400;color:var(--muted);font-size:12px}
.stream{display:inline-block;border-radius:6px;padding:2px 10px;font-size:13px;font-weight:700}
.s-core{background:var(--sign);color:#fff}
.s-research{background:#2F5E9E;color:#fff}
.s-thai{background:#7A3E8F;color:#fff}
.s-innov{background:var(--mark);color:var(--mark-ink)}
.src{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);display:grid;gap:4px}
.src a{color:var(--text);text-decoration:underline;text-decoration-color:var(--mark);text-underline-offset:3px;word-break:break-word}
.src .ptitle{font-style:italic}
.load-box{display:grid;gap:10px;justify-items:start}
#diag{width:100%}#diag ol{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
#diag li{border:1px solid var(--line);border-left:4px solid var(--muted);border-radius:0 8px 8px 0;padding:8px 10px;background:var(--panel-2);font-size:14px}
#diag li.ok{border-left-color:var(--ok)}#diag li.bad{border-left-color:var(--bad)}
#diag .tag{font-weight:700;margin-right:6px}#diag li.ok .tag{color:var(--ok)}#diag li.bad .tag{color:var(--bad)}
#diag .fix{display:block;margin-top:4px;font-weight:600}#diag small{display:block;color:var(--muted);word-break:break-word}
.badge{display:inline-block;background:var(--panel-2);border:1px solid var(--mark);color:var(--text);border-radius:5px;padding:0 6px;font-size:12px;font-weight:600;width:max-content}
.archive{display:grid;gap:8px}
.arc{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px}
.arc-day{font:700 18px/1.2 var(--font-sign);color:var(--muted);flex:none;width:52px}
.arc-body{min-width:0}
.arc-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px;color:var(--muted);margin-top:4px}


/* ===== ทางหลวงของฉัน (ฉากตัวต่อ 3D) ===== */
.stage{position:relative;height:clamp(360px,62vh,600px);border-radius:14px;overflow:hidden;border:1px solid var(--line);
  background:linear-gradient(180deg,#7EC4FF 0%,#CFEBFF 55%,#EAF4DA 100%)}
.stage .gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab}
.stage .gl:active{cursor:grabbing}
.hud{position:absolute;top:12px;left:12px;z-index:2;min-width:190px;max-width:calc(100% - 24px);padding:10px 14px;border-radius:12px;color:#fff;
  background:rgba(10,26,42,.80);border:1px solid rgba(242,183,5,.75);box-shadow:0 0 18px rgba(242,183,5,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hud-km{display:flex;align-items:baseline;gap:6px}
.hud-km b{font:700 34px/1 var(--font-sign);color:var(--mark)}
.hud-km span{font:600 16px var(--font-sign);opacity:.9}
.hud .track{margin:8px 0 6px;background:rgba(255,255,255,.18)}
.hud-rank{font-weight:600;font-size:14px}
.hud-rank small{font-weight:400;opacity:.85}
.gl-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:2;font-size:12px;color:#fff;background:rgba(10,26,42,.7);border-radius:999px;padding:3px 12px;white-space:nowrap;pointer-events:none}
.gl-fail{position:absolute;inset:auto 12px 44px 12px;z-index:3;background:rgba(10,26,42,.88);color:#fff;border-radius:10px;padding:10px 12px;font-size:14px}
.reward{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;background:rgba(10,26,42,.35);padding:16px}
.reward[hidden]{display:none}
.rw-in{background:rgba(10,26,42,.92);color:#fff;border:1.5px solid var(--mark);box-shadow:0 0 28px rgba(242,183,5,.35);border-radius:14px;padding:18px 20px;text-align:center;max-width:340px;animation:pop .35s ease-out}
.rw-in h4{margin:10px 0 4px;font:700 26px/1.15 var(--font-sign)}
.rw-in p{margin:4px 0}
.rw-unlock{border-left:4px solid var(--c);background:rgba(255,255,255,.08);border-radius:6px;padding:6px 10px;text-align:left}
.rw-in .btn{margin-top:12px}
.rw-brick{width:64px;height:30px;margin:0 auto;background:var(--mark);border-radius:4px;position:relative;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18)}
.rw-brick i{position:absolute;top:-8px;width:18px;height:9px;border-radius:4px 4px 0 0;background:var(--mark);box-shadow:inset 0 2px 0 rgba(255,255,255,.35)}
.rw-brick i:first-child{left:10px}.rw-brick i:last-child{right:10px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.ranks{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;opacity:.6}
.rk.on{opacity:1}
.rk.cur{border:2px solid var(--mark);box-shadow:0 0 0 3px rgba(242,183,5,.18)}
.rk b{display:block;font:600 17px/1.15 var(--font-sign)}
.rk small{color:var(--muted)}
.lms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.lm{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px 12px;opacity:.75}
.lm.built{opacity:1}
.lm-ic{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel-2);flex:none}
.lm.built .lm-ic{background:var(--c);color:#fff}
.lm-ic svg{width:16px;height:16px}
.lm b{display:block}
.lm small{color:var(--muted);font-size:13px}
@media (max-width:600px){.ranks{grid-template-columns:repeat(2,1fr)}.hud{min-width:0;top:8px;left:8px;padding:7px 10px}.hud-km b{font-size:26px}.hud .track{margin:5px 0 4px}.hud-rank small{display:none}}

/* ===== แถบเมนูล่าง ===== */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{border:0;background:transparent;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;color:var(--muted);min-height:64px}
nav.tabs svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--mark);box-shadow:inset 0 3px 0 var(--mark)}

@media (max-width:420px){
  .brand p{display:none}
  .guide-btn .lbl-long{display:none}
  .xp{font-size:14px}
  main{padding:14px 12px 110px}
  .sign-in{padding:14px 12px 12px;gap:4px 12px}
  .sign-arrow{width:44px;height:44px}
  textarea{min-height:64px}
}
@media (min-width:900px){
  main{padding-top:26px}
  .terms{grid-template-columns:repeat(3,1fr)}
}

<script>
/* ╔════════════════════════════════════════════════════════════════════╗
 * ║  ⚙️  ตั้งค่า (CONFIG) — แก้บรรทัดเดียว                                    ║

 * ╚════════════════════════════════════════════════════════════════════╝ */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbxEZtmvZDSyRwJXkUFaMTDQSw2IFRIGFLaQkvNglunK2kjp9a0IEBLbLwnEuZOCdd4SZA/exec';

<div id="seGate" role="dialog" aria-modal="true" aria-labelledby="gTitle" hidden>
  <form class="g-in" id="gForm" novalidate>

    <button type="submit" class="btn primary" id="gBtn">เข้าใช้งาน</button>

</div>
<script>
/* ---------- ตัวเชื่อม API: หน้าตาเหมือน google.script.run แต่ส่งคำสั่งไป doPost พร้อมรหัสแอป ----------
 * หน้าเว็บส่วนที่เหลือเหมือนกับ Index.html ของ Apps Script ทุกอย่าง */
(function(){
  window.SE_HOST='app';
  var FNS=["seGetTopicForDate", "seGetProgress", "seRecordActivity", "seReviewVocab", "seCoachWriting", "seCoachTalk", "seCoachExplain", "seSaveWord", "seResolveMistake", "seGetEmailTask", "seCoachEmail", "seRewriteSummary", "seDiagnose", "seGetThaiBrief"], KEY='se_app_code';
  var URL_OK=/^https:\/\/script\.google\.com\/macros\/s\/[^\/]+\/exec$/;
  function code(){ try{ return localStorage.getItem(KEY)||''; }catch(e){ return ''; } }
  function $(id){ return document.getElementById(id); }
  function gate(msg){
    var g=$('seGate'); if(!g) return;
    if(!URL_OK.test(EXEC_URL)){
      $('gLead').innerHTML='ยังไม่ได้ตั้งค่าลิงก์แอป — เปิด <b>index.html</b> ใน GitHub แล้ววางลิงก์ที่ลงท้ายด้วย <b>/exec</b> ในบรรทัด <b>EXEC_URL</b> ด้านบนสุด';
      $('gCode').disabled=true; $('gBtn').disabled=true;
    }
    $('gErr').textContent=msg||'';
    g.hidden=false;
    if(!$('gCode').disabled) setTimeout(function(){ $('gCode').focus(); },50);
  }
  function post(body,done){
    var x=new XMLHttpRequest();
    x.open('POST',EXEC_URL);
    x.setRequestHeader('Content-Type','text/plain;charset=utf-8');   /* text/plain = ไม่มี CORS preflight ที่ Apps Script รับไม่ได้ */
    x.timeout=60000;
    x.onload=function(){
      var r=null; try{ r=JSON.parse(x.responseText); }catch(e){}
      done(r||{ok:false,error:'แอปตอบกลับผิดรูปแบบ — ตรวจว่า deploy แบบ Who has access: Anyone และใช้ลิงก์ /exec ของ deployment นั้น'});
    };
    x.onerror=x.ontimeout=function(){ done({ok:false,error:'เชื่อมต่อไม่ได้ — ตรวจอินเทอร์เน็ต หรือ deploy แบบ Who has access: Anyone'}); };
    x.send(JSON.stringify(body));
  }
  function call(fn,args,ok,fail){
    var bad=function(m){ if(fail) fail(new Error(m)); };
    if(!URL_OK.test(EXEC_URL)){ gate(); return bad('ยังไม่ได้ตั้งค่าลิงก์แอป (EXEC_URL)'); }
    if(!code()){ gate(); return; }
    post({fn:fn,args:args,token:code()},function(r){
      if(r.ok){ if(ok) ok(r.result); return; }
      if(r.auth){ try{ localStorage.removeItem(KEY); }catch(e){} gate(r.error); }
      bad(r.error||'เกิดข้อผิดพลาด');
    });
  }
  function Runner(s,f){ this._s=s; this._f=f; }
  Runner.prototype.withSuccessHandler=function(h){ return new Runner(h,this._f); };
  Runner.prototype.withFailureHandler=function(h){ return new Runner(this._s,h); };
  FNS.forEach(function(n){ Runner.prototype[n]=function(){ call(n,[].slice.call(arguments),this._s,this._f); }; });
  window.google={script:{run:new Runner(null,null)}};

  /* ฟอร์มใส่รหัส: ตรวจกับเซิร์ฟเวอร์ก่อนจำ แล้วโหลดแอปใหม่ */
  document.addEventListener('submit',function(e){
    if(e.target.id!=='gForm') return;
    e.preventDefault();
    var v=$('gCode').value.trim(), btn=$('gBtn');
    if(!v){ $('gErr').textContent='ใส่รหัสแอปก่อน'; return; }
    btn.disabled=true; btn.textContent='กำลังตรวจรหัส…'; $('gErr').textContent='';
    post({fn:'ping',args:[],token:v},function(r){
      btn.disabled=false; btn.textContent='เข้าใช้งาน';
      if(r.ok){ try{ localStorage.setItem(KEY,v); }catch(x){} location.reload(); return; }
      $('gErr').textContent=r.error||'ตรวจรหัสไม่สำเร็จ';
    });
  });
  if(!URL_OK.test(EXEC_URL)||!code()) document.addEventListener('DOMContentLoaded',function(){ gate(); });
})();
</script>

/* ---------- หมวดหมู่เนื้อหา (ของจริงอยู่ในชีต Categories) ---------- */
var CATS = {
  pave:   {th:'ผิวทางและวัสดุ',            en:'Pavement & Materials',        color:'#E0A100'},
  recyc:  {th:'รีไซเคิลและความยั่งยืน',     en:'Recycling & Sustainability',  color:'#3FAF6B'},

/* ---------- สายเนื้อหา 4 สาย (สุ่มวันละ 1 เรื่อง) ---------- */
var STREAMS = {
  core:    {th:'ความรู้หลัก',        en:'Core knowledge'},
  research:{th:'งานวิจัยต่างประเทศ', en:'International research'},

/* ---------- เรื่องตัวอย่าง 1 เรื่องต่อสาย (ของจริงอ่านจากชีต Topics) ---------- */
var TOPICS = [
 { stream:'core', cat:'pave', title:'Warm Mix Asphalt', sub:'Paving at lower temperatures — what changes on site?', minutes:12,
   summary:'Warm mix asphalt, or WMA, is produced and placed at temperatures about 20 to 40 degrees Celsius lower than conventional hot mix asphalt. Contractors lower the temperature by foaming the binder with a small amount of water, or by adding organic or chemical additives. Because the plant burns less fuel, WMA reduces emissions and fumes, which also makes working conditions better for the paving crew. The mix stays workable for longer, so it can be hauled further and compacted in cooler weather. However, engineers still need to check moisture sensitivity and early rutting resistance, especially when a foaming process is used.',
   titleTh:'แอสฟัลต์ผสมอุ่น (Warm Mix Asphalt)', subTh:'ปูผิวทางที่อุณหภูมิต่ำลง — หน้างานเปลี่ยนอะไรบ้าง?',

/* ---------- เสียงพูด (Text-to-Speech) ---------- */
/* เลือกเสียงตามภาษา · อังกฤษ: ออสเตรเลีย > อังกฤษ > อเมริกัน · ไทย: เสียงไทยของเครื่อง (Mac = Kanya) · ไม่มี = null */
function pickVoice(lang){
  var vs=('speechSynthesis' in window)?speechSynthesis.getVoices():[];
  if(lang==='th') return vs.filter(function(x){return /^th/i.test(x.lang);})[0]||null;
  return vs.filter(function(x){return /en-AU/i.test(x.lang);})[0]||vs.filter(function(x){return /en-GB/i.test(x.lang);})[0]||vs.filter(function(x){return /^en/i.test(x.lang);})[0]||null;
}
/* วิธีเพิ่มเสียงไทยตามชนิดเครื่อง · iPhone มีเสียงไทยในตัว · Mac/Windows ต้องดาวน์โหลดเอง แล้วปิด-เปิดเบราว์เซอร์ใหม่ */
var IS_IOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
var IS_MAC=!IS_IOS&&/Mac/.test(navigator.platform||navigator.userAgent), IS_WIN=/Win/.test(navigator.platform||navigator.userAgent);
var NO_TH_VOICE='เครื่องนี้ไม่มีเสียงภาษาไทยให้เบราว์เซอร์ใช้ — '+(IS_MAC
  ?'Mac: การตั้งค่าระบบ › การช่วยการเข้าถึง › เนื้อหาที่พูด (Spoken Content) › เสียงของระบบ › จัดการเสียง… › ไทย › ติ๊ก Kanya ให้ดาวน์โหลด แล้วปิด Chrome ทั้งหมดด้วย ⌘Q แล้วเปิดใหม่'
  :IS_IOS?'ตั้งค่า › การช่วยการเข้าถึง › เนื้อหาที่พูด › เสียง › ไทย'
  :IS_WIN?'Windows: ตั้งค่า › เวลาและภาษา › เสียงพูด › เพิ่มเสียง › ไทย แล้วปิด-เปิดเบราว์เซอร์ใหม่'
  :'เพิ่มเสียงภาษาไทยในการตั้งค่าเสียงพูดของเครื่อง แล้วปิด-เปิดเบราว์เซอร์ใหม่');
/* รายชื่อเสียงโหลดแล้วหรือยัง (Chrome โหลดช้า — ยังว่าง = ยังไม่รู้ ให้เบราว์เซอร์เลือกเสียงตามภาษาเอง) */
function voicesKnown(){ return ('speechSynthesis' in window)&&speechSynthesis.getVoices().length>0; }
/* ข้อความไทย: รอรายชื่อเสียงโหลดเสร็จก่อน (สูงสุด 2 วินาที) — ไม่อย่างนั้น Chrome จะใช้เสียงเริ่มต้น (อังกฤษ) อ่านภาษาไทย */
function withVoices(cb){
  if(!('speechSynthesis' in window)||voicesKnown()) return cb();
  var done=false, fire=function(){ if(done) return; done=true; try{ speechSynthesis.removeEventListener('voiceschanged',fire); }catch(e){} cb(); };
  try{ speechSynthesis.addEventListener('voiceschanged',fire); }catch(e){}
  setTimeout(fire,2000);
}
/* บอกในโหมดไทยว่าใช้เสียงอะไรอ่าน หรือบอกวิธีเพิ่มเสียงไทย */
function thVoiceText(){
  if(!('speechSynthesis' in window)) return 'เบราว์เซอร์นี้อ่านออกเสียงไม่ได้';
  if(!voicesKnown()) return '';
  var v=pickVoice('th');
  return v?'เสียงอ่านภาษาไทย: '+v.name:NO_TH_VOICE;
}
function thVoiceNoteHTML(){ var x=thVoiceText(); return '<p class="demo-note" id="thVoiceNote"'+(x?'':' hidden')+'>'+esc(x)+'</p>'; }
function hasTH(s){ return /[\u0E00-\u0E7F]/.test(String(s||'')); }
/* ข้อความไทย = เสียงไทย · ข้อความอังกฤษ = เสียงอังกฤษ (ไม่มีเสียงไทยในเครื่อง → แจ้ง ไม่ให้เสียงอังกฤษอ่านภาษาไทย) */
function speak(text,who,btn){
  try{
    if(!('speechSynthesis' in window)){alert('เบราว์เซอร์นี้ไม่รองรับการอ่านออกเสียง'); return;}
    speechSynthesis.cancel();
    var th=hasTH(text), myId=(ST.speakSeq=(ST.speakSeq||0)+1);
    var run=function(){
      if(ST.speakSeq!==myId) return;   /* ถูกหยุด/กดอันอื่นระหว่างรอรายชื่อเสียง */
      var v=pickVoice(th?'th':'en');
      if(th&&!v&&voicesKnown()){ markSpeakBtn(null); toast(NO_TH_VOICE,true); return; }
      var u=new SpeechSynthesisUtterance(text);
      if(v) u.voice=v;
      u.lang=v?v.lang:(th?'th-TH':'en-GB');
      u.rate=ST.slow?0.8:0.95;
      u.onend=u.onerror=function(){ if(ST.speakSeq!==myId) return; if(who==='liam'&&ST.liam==='speaking') setLiam('idle'); markSpeakBtn(null); };
      if(who==='liam') setLiam('speaking');
      markSpeakBtn(btn||null);
      speechSynthesis.speak(u);
    };
    if(th) withVoices(run); else run();
  }catch(e){console.error('speak error',e);}
}

/* ---------- รับเสียงพูด (Speech-to-Text) ---------- */
/* เว็บแอป Apps Script ครอบหน้าไว้ใน iframe ที่ Google ไม่เปิดสิทธิ์ไมโครโฟน — แก้จากโค้ดในแอปไม่ได้ จึงแนะนำให้ใช้การพิมพ์ด้วยเสียงของเครื่อง */
var MIC_NOTE=IN_APP?'<b>ปุ่ม "พูด" ใช้ไมค์ได้</b> (ครั้งแรกเบราว์เซอร์จะขออนุญาตใช้ไมค์ — กดอนุญาต) · ใช้ได้ดีที่สุดบน Chrome':'<b>ปุ่ม "พูด" ใช้ไมค์ในเว็บแอปนี้ไม่ได้</b> (ข้อจำกัดของ Google) ให้ใช้การพิมพ์ด้วยเสียงของเครื่องแทน: Mac กด Fn/🌐 สองครั้ง · Windows กด Win+H · มือถือแตะไมค์บนแป้นพิมพ์ — หรือเปิดจากแอปบน GitHub ซึ่งใช้ไมค์ได้';
var MIC_GAS_MSG='เว็บแอปบน Google Apps Script ไม่เปิดสิทธิ์ไมค์ให้หน้าเว็บ — ใช้การพิมพ์ด้วยเสียงของเครื่องแทนได้: คลิกในช่องพิมพ์ แล้ว Mac กดปุ่ม Fn/🌐 สองครั้ง · Windows กด Win+H · มือถือแตะไมค์บนแป้นพิมพ์ (ตั้งภาษาเป็นอังกฤษก่อนพูด)';
function listen(textarea, btn, statusEl){
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){statusEl.textContent='เบราว์เซอร์นี้ยังไม่รองรับการพูด — ลองเปิดด้วย Chrome หรือพิมพ์แทน'; return;}
  if(ST.listening){ST.listening.stop(); return;}
  try{
    var r=new SR(); r.lang='en-US'; r.interimResults=true; r.continuous=false;
    var base=textarea.value?textarea.value.trim()+' ':'';
    r.onstart=function(){btn.classList.add('live'); btn.querySelector('span').textContent='กำลังฟัง… แตะเพื่อหยุด'; statusEl.textContent='';};
    r.onresult=function(ev){var t='';for(var i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;textarea.value=base+t;};
    r.onerror=function(ev){statusEl.textContent=ev.error==='not-allowed'?((IN_GAS&&!IN_APP)?MIC_GAS_MSG:'ไมโครโฟนถูกปิดกั้น — อนุญาตไมค์ในเบราว์เซอร์ แล้วลองใหม่'):'รับเสียงไม่สำเร็จ ('+ev.error+') ลองพูดใหม่อีกครั้ง';};
    r.onend=function(){ST.listening=null; btn.classList.remove('live'); btn.querySelector('span').textContent='พูด';};
    ST.listening=r; r.start();
  }catch(e){statusEl.textContent='เริ่มรับเสียงไม่ได้: '+e.message;}
}

}

/* ประโยคภาษาไทย: ฉบับไทยคั่นด้วยขึ้นบรรทัด · บทคัดย่อก้อนเดียว → ตัดที่ช่องว่างเป็นช่วงละประมาณ 120 ตัวอักษร */
function thLines(txt){
  txt=String(txt||'').trim(); if(!txt) return [];
  if(txt.indexOf('\n')>-1) return txt.split('\n').map(function(x){return x.trim();}).filter(Boolean);
  var out=[], cur='';
  txt.split(/\s+/).forEach(function(w){ cur=cur?cur+' '+w:w; if(cur.length>=120){ out.push(cur); cur=''; } });
  if(cur) out.push(cur);
  return out;
}

/* ขอฉบับไทยจาก backend (เฉพาะเรื่องจริงที่ยังไม่มี) · ผิดพลาดแล้วไม่ลองเองซ้ำ (ไม่เปลืองโควตา) ต้องกด "ลองอีกครั้ง" */
function ensureThai(force){
  var t=curTopic();
  if(!isTH()||thaiOf(t)||!IN_GAS||DATA.mode!=='live') return;
  var st=(ST.thai&&ST.thai.id===t.id)?ST.thai:null;
  if(st&&(st.state==='loading'||(st.state==='error'&&!force))) return;
  ST.thai={id:t.id,state:'loading',err:''};
  var back=function(){ if(ST.screen==='today'&&curTopic()===t&&isTH()) renderKnow(false); };
  google.script.run
    .withSuccessHandler(function(r){ t.titleTh=r.title; t.subTh=r.sub; t.summaryTh=r.summary; ST.thai={id:t.id,state:'ok',err:''}; back(); })
    .withFailureHandler(function(e){
      var m=(e&&e.message?e.message:String(e)).replace(/^Exception:\s*/,'');
      if(/^QUOTA/.test(m)) m='โค้ช AI ครบโควตาของวันนี้แล้ว — อ่านฉบับ English ไปก่อน แล้วลองใหม่พรุ่งนี้';
      ST.thai={id:t.id,state:'error',err:m}; back();
    })
    .seGetThaiBrief(localYmd(),t.id);
}

function setLang(lang){

var TH_MONTHS=['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function thDate(ymd){var p=String(ymd||'').split('-');if(p.length<3)return '';return (+p[2])+' '+TH_MONTHS[+p[1]-1]+' '+(+p[0]+543);}
function localYmd(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
/* ดึงเรื่องของวันจาก backend แล้ววาดหน้าเรื่องวันนี้ใหม่ถ้ากำลังเปิดอยู่ */

/* ---------- Shadowing: ฟังประโยค แล้วพูดตาม (พิมพ์ด้วยเสียงของเครื่อง) · ตรวจคำที่ตรงตามลำดับ ---------- */
function shadowList(){
  var t=curTopic(), src=t.stream==='thai'?(t.activity&&t.activity.model||''):curSummary();
  var out=[];
  (String(src).match(/[^.!?]+[.!?]*/g)||[]).forEach(function(x){ out=out.concat(shChunk(x.trim())); });
  return out.filter(function(x){return x.split(/\s+/).length>=4;}).slice(0,6);
}
/* ประโยคยาวเกิน 20 คำ → แบ่งเป็นช่วงสั้นให้พูดตามไหว (ตัดที่จุลภาคก่อน ไม่มีจึงตัดทุก ~15 คำ) */
function shChunk(x){
  var w=x.split(/\s+/); if(w.length<=20) return [x];
  var parts=x.split(/(?:,|;)\s+/);
  if(parts.length>1&&parts.every(function(p){return p.split(/\s+/).length<=20;})) return parts;
  var out=[]; for(var i=0;i<w.length;i+=15) out.push(w.slice(i,i+15).join(' '));
  if(out.length>1&&out[out.length-1].split(' ').length<5) out[out.length-2]+=' '+out.pop();   /* ช่วงท้ายสั้นเกิน → รวมกับช่วงก่อน */
  return out;
}
function shWords(x){ return String(x).toLowerCase().replace(/[^a-z0-9'\s-]/g,' ').split(/\s+/).filter(Boolean); }
/* ความยาวลำดับย่อยร่วมที่ยาวที่สุด (LCS) → ระบุคำที่พูดตามตรงลำดับ */
function shMatch(target,said){
  var a=shWords(target), b=shWords(said), n=a.length, m=b.length, L=[], i, j;
  for(i=0;i<=n;i++){ L[i]=[]; for(j=0;j<=m;j++) L[i][j]=(i&&j)?(a[i-1]===b[j-1]?L[i-1][j-1]+1:Math.max(L[i-1][j],L[i][j-1])):0; }
  var hit=[]; i=n; j=m;
  while(i>0&&j>0){ if(a[i-1]===b[j-1]){ hit[i-1]=true; i--; j--; } else if(L[i-1][j]>=L[i][j-1]) i--; else j--; }
  return { pct:n?Math.round(L[n][m]/n*100):0, hit:hit, words:a };
}

/* ---------- โหมดฟังระหว่างเดินทาง: อ่านต่อเนื่องทั้งเรื่อง (หัวข้อ · บทสรุป · คำศัพท์ อังกฤษ–ไทย · ตัวอย่างคำตอบ) ---------- */
function lsTracks(){

function lsPlayFrom(i){
  if(!('speechSynthesis' in window)){ toast('เบราว์เซอร์นี้อ่านออกเสียงไม่ได้',true); return; }
  var S=ST.ls; if(!S) return;

  if(!S.playing) return;
  var tr=S.tracks[S.i];
  var run=function(){
    if(!S.playing||S.seq!==my) return;
    var u=new SpeechSynthesisUtterance(tr.x), vo=pickVoice(tr.lang);
    if(tr.lang==='th'&&!vo&&voicesKnown()){   /* ไม่มีเสียงไทยในเครื่อง → ข้ามภาษาไทย ไม่ให้เสียงอังกฤษอ่านภาษาไทย */

      setTimeout(function(){ if(S.playing&&S.seq===my) lsPlayFrom(S.i+1); },50); return;

}

/* สลับลำดับแบบสุ่ม (Fisher–Yates) · หลีกเลี่ยงลำดับเดิมของรอบก่อนเมื่อทำได้ */
function shuffledOrder(n,key){
  var prev=(ST.lastOrder||{})[key], ord, tries=0;
  do{ ord=[]; for(var i=0;i<n;i++) ord.push(i);
      for(var j=n-1;j>0;j--){ var k=Math.floor(Math.random()*(j+1)), tmp=ord[j]; ord[j]=ord[k]; ord[k]=tmp; }
      tries++; }while(n>1&&prev&&ord.join()===prev&&tries<6);

  return ord;
}

/* เปลี่ยนท่าทางที่ปรึกษา — แก้เฉพาะ class/ข้อความ ไม่วาดหน้าใหม่ */
function setLiam(state,ms){
  clearTimeout(ST.liamT); clearInterval(ST.liamW);   /* ล้างตัวจับเวลาก่อนเสมอ แม้ออกจากหน้าคุยงานแล้ว */
  ST.liam=state;

  if(!el) return;
  el.setAttribute('class','liam '+state); if(box) box.className='panel persona '+state;
  if(tx) tx.lastChild.textContent=LIAM_TEXT[state]||'';
  if(ms) ST.liamT=setTimeout(function(){ if(ST.liam===state) setLiam('idle'); },ms);
  if(state==='speaking'&&!ms){   /* พูดด้วยเสียงจริง: เฝ้าดูจนเสียงจบ (บางเบราว์เซอร์ไม่ส่ง onend) */
    var quiet=0; ST.liamW=setInterval(function(){
      var busy=('speechSynthesis' in window)&&(speechSynthesis.speaking||speechSynthesis.pending);
      quiet=busy?0:quiet+1; if(quiet>=3&&ST.liam==='speaking') setLiam('idle');
    },300);
  }
}

function mockFeedback(text,model){
  var tips=[], words=text.trim().split(/\s+/).filter(Boolean);
  var sentences=text.split(/[.!?]+/).filter(function(s){return s.trim();});
  if(/[\u0E00-\u0E7F]/.test(text)) tips.push('มีภาษาไทยปนอยู่ ลองตอบเป็นภาษาอังกฤษทั้งประโยค');
  if(words.length<8) tips.push('ตอบสั้นไปนิด ลองบอกทั้ง "สาเหตุ" และ "สิ่งที่จะทำต่อ"');
  if(!/\b(because|so|due to|caused)\b/i.test(text)) tips.push('ใส่คำเชื่อมเหตุผล เช่น because / so ให้ฟังเข้าใจง่ายขึ้น');
  if(sentences.length&&words.length/sentences.length>22) tips.push('ประโยคยาวเกินไป แบ่งเป็นประโยคสั้น ๆ ชาวต่างชาติจะตามทันกว่า');
  if(!tips.length) tips.push('ชัดเจนดีมาก มีเหตุผลและแผนงานครบ');
  return '<b>ฟีดแบ็ก (จำลอง)</b><ul>'+tips.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'+
    (model?'<div style="margin-top:6px">วิธีพูดที่ชัดขึ้น: <span class="en">'+esc(model)+'</span></div>':'');
}

  var text=ta.value.trim();

  if(ST.talkEnded){st.textContent='จบบทสนทนาวันนี้แล้ว'; return;}
  st.textContent=''; btnBusy(btn,'กำลังตอบ…');
  var c=document.getElementById('chat');
  var me=document.createElement('div'); me.className='msg me en'; me.textContent=text; c.appendChild(me);
  var ty=document.createElement('div'); ty.className='typing'; ty.textContent=CONSULTANT.name+' is typing…'; c.appendChild(ty); setLiam('thinking');
  ta.value=''; document.getElementById('hintBox').innerHTML='';
  if(!ST.talkLog) ST.talkLog=[{who:'liam',text:SCRIPT[0].say}];
  var turn=ST.turn+1;
  google.script.run
    .withSuccessHandler(function(r){
      ty.remove();
      var fb=document.createElement('div'); fb.className='fb';
      fb.innerHTML='<b>ฟีดแบ็กจากโค้ช AI</b>'+tipsHTML(r.tips)+(r.clearer?'<div style="margin-top:6px">วิธีพูดที่ชัดขึ้น: <span class="en">'+esc(r.clearer)+'</span></div>':'')+mistakesHTML(r.mistakes);

function scoreExplainMock(){
  var ta=document.getElementById('exp'), st=document.getElementById('expStatus'), btn=document.getElementById('expScore');
  var text=ta.value.trim(); if(!text){st.textContent='ยังไม่มีคำอธิบาย — พิมพ์หรือพูดก่อนส่ง'; return;}
  st.textContent=''; btn.disabled=true; btn.classList.add('busy'); btn.querySelector('span').textContent='กำลังตรวจ…';
  setTimeout(function(){
    var low=text.toLowerCase(), words=text.split(/\s+/).filter(Boolean).length;
    var sents=Math.max(1,text.split(/[.!?]+/).filter(function(s){return s.trim();}).length);
    var hits=EXPLAIN.keys.filter(function(k){return low.indexOf(k)>-1;}).length;
    var jar=EXPLAIN.jargon.filter(function(k){return low.indexOf(k)>-1;}).length;
    var thai=/[\u0E00-\u0E7F]/.test(text);
    var clarity=clamp(100-Math.max(0,words/sents-16)*4-jar*8-(words<20?25:0));
    var lang=clamp(thai?40:72+(/^[A-Z]/.test(text)?8:0)+(/[.!?]$/.test(text)?8:0)+(sents>=3?8:0));
    var acc=clamp(35+hits*9);
    var avg=Math.round((clarity+lang+acc)/3), gain=Math.round(avg/5);
    addXP(gain);
    recordTask('explain',{xp:gain,clarity:clarity,language:lang,accuracy:acc});
    var tip=jar?'มีศัพท์เทคนิคที่คนทั่วไปไม่รู้จัก ('+EXPLAIN.jargon.filter(function(k){return low.indexOf(k)>-1;}).join(', ')+') ถ้าจำเป็นต้องใช้ ให้อธิบายต่อท้ายสั้น ๆ':
      hits<4?'ลองบอกให้ครบ 3 เรื่อง: ทดสอบอะไร (ดิน) · ทำอย่างไร (กดแท่งเหล็ก เทียบกับหินมาตรฐาน) · ใช้ทำอะไร (ออกแบบความหนาชั้นทาง)':
      'ครอบคลุมหลักการครบ ลองลดความยาวประโยคให้เหลือไม่เกิน 15 คำ จะฟังง่ายขึ้นอีก';
    document.getElementById('expResult').innerHTML='<h3>ผลคะแนน (จำลอง) · +'+gain+' XP</h3><div class="panel"><div class="bars">'+
      bar('ความชัดเจน — ฝรั่งฟังเข้าใจไหม',clarity)+bar('ภาษา / ไวยากรณ์',lang)+bar('ความถูกต้องทางวิชาการ',acc)+
      '</div><p style="margin:0 0 12px">'+esc(tip)+'</p><div class="model"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b>ตัวอย่างคำอธิบายที่ดี</b>'+speakerBtn(EXPLAIN.model,'ตัวอย่างคำอธิบาย')+'</div><p class="en" style="margin:6px 0 0">'+esc(EXPLAIN.model)+'</p></div></div>'+
      '<div class="row" style="margin-top:14px"><button type="button" class="btn primary" data-go="review">ไปทบทวน</button></div>';
    requestAnimationFrame(function(){document.querySelectorAll('.fill').forEach(function(f){f.style.width=f.dataset.v+'%';});});
    btn.classList.remove('busy'); btn.classList.add('done'); btn.querySelector('span').textContent='✓ ตรวจแล้ว';
    setTimeout(function(){btn.classList.remove('done'); btn.disabled=false; btn.querySelector('span').textContent='ส่งให้ตรวจอีกครั้ง';},2500);
    document.getElementById('expResult').scrollIntoView({behavior:'smooth',block:'start'});
  },800);
}

function lmAt(i){for(var k=0;k<LANDMARKS.length;k++){if(LANDMARKS[k].seg.indexOf(i)>-1)return LANDMARKS[k];}return null;}
function isRiver(i){var l=lmAt(i);return !!(l&&l.river);}
function rankOf(km){var r=RANKS[0];RANKS.forEach(function(x){if(km>=x.km)r=x;});return r;}
function nextRank(km){for(var i=0;i<RANKS.length;i++){if(RANKS[i].km>km)return RANKS[i];}return null;}

/* ---------- เสียง: สร้างสดด้วย Web Audio API (เพลงแต่งใหม่ ไม่มีไฟล์เสียงภายนอก) ---------- */
var AUD = {ctx:null, music:true, sfx:true, timer:null, step:0, next:0, playing:false};
(function(){try{var m=localStorage.getItem('se_music'),s=localStorage.getItem('se_sfx');if(m!==null)AUD.music=m==='1';if(s!==null)AUD.sfx=s==='1';}catch(e){}})();
/* ระดับเสียงรวม (เพลง + เอฟเฟกต์) 0–10 · ค่าเริ่มต้น 8 = ความดังเดิม */
AUD.vol=8; (function(){try{var v=localStorage.getItem('se_vol');if(v!==null&&!isNaN(+v))AUD.vol=Math.max(0,Math.min(10,Math.round(+v)));}catch(e){}})();
function volGain(){return 0.9*AUD.vol/8;}
function setVol(v){
  AUD.vol=Math.max(0,Math.min(10,v)); try{localStorage.setItem('se_vol',String(AUD.vol));}catch(e){}
  if(AUD.ctx&&AUD.master) AUD.master.gain.setTargetAtTime(volGain(),AUD.ctx.currentTime,0.05);
  var t=document.getElementById('volVal'), f=document.getElementById('volFill');   /* อัปเดตเฉพาะจุด ไม่วาดหน้าใหม่ */
  if(t) t.textContent=AUD.vol===0?'ปิดเสียง':AUD.vol+'/10';
  if(f) f.style.width=(AUD.vol*10)+'%';
  var dn=document.getElementById('volDown'), up=document.getElementById('volUp');
  if(dn) dn.disabled=AUD.vol<=0; if(up) up.disabled=AUD.vol>=10;
}
function savePref(k,v){try{localStorage.setItem(k,v?'1':'0');}catch(e){}}
function audio(){
  try{
    if(!AUD.ctx){
      var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null;
      var c=new AC(); AUD.ctx=c;
      AUD.master=c.createGain(); AUD.master.gain.value=volGain(); AUD.master.connect(c.destination);
      AUD.musicBus=c.createGain(); AUD.musicBus.gain.value=0; AUD.musicBus.connect(AUD.master);
      AUD.sfxBus=c.createGain(); AUD.sfxBus.gain.value=0.55; AUD.sfxBus.connect(AUD.master);
      var len=c.sampleRate*0.3, buf=c.createBuffer(1,len,c.sampleRate), d=buf.getChannelData(0);
      for(var i=0;i<len;i++) d[i]=Math.random()*2-1;
      AUD.noise=buf;
    }
    if(AUD.ctx.state==='suspended') AUD.ctx.resume();
    return AUD.ctx;
  }catch(e){console.error('audio init error',e);return null;}
}
function mtof(m){return 440*Math.pow(2,(m-69)/12);}
function tone(bus,f,t,dur,type,peak,attack){
  var c=AUD.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type; o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(peak,t+(attack||0.008));
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.05);
}
/* เพลง: 96 BPM คอร์ด C–Am–F–G เมโลดี้เสียงไม้เคาะแบบมาริมบา + เบส + แพดนุ่ม + เชคเกอร์เบา ๆ */
var SONG = {
  chords:[[60,64,67],[57,60,64],[53,57,60],[55,59,62]], bass:[48,45,41,43],
  mel:[[76,0,79,0,81,0,79,76,0,0,74,0,76,0,0,0],[81,0,79,0,76,0,74,76,0,0,72,0,0,0,69,0],
       [72,0,77,0,81,0,77,0,76,0,74,0,72,0,0,0],[74,0,76,0,79,0,83,0,81,0,79,0,76,0,74,0]]
};
var STEP=60/96/2; /* โน้ตเขบ็ตหนึ่งชั้น */
function scheduleStep(n,t){
  var bar=Math.floor(n/16)%4, s=n%16, bus=AUD.musicBus, c=AUD.ctx;
  var m=SONG.mel[bar][s];
  if(m){ tone(bus,mtof(m),t,0.45,'sine',0.22); tone(bus,mtof(m+12),t,0.18,'triangle',0.05); }
  if(s===0||s===8) tone(bus,mtof(SONG.bass[bar]-12),t,0.55,'triangle',0.28);
  if(s===0) SONG.chords[bar].forEach(function(cm){tone(bus,mtof(cm),t,STEP*16,'sine',0.045,0.6);});
  if(s%4===2){ /* เชคเกอร์ */
    var src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
    src.buffer=AUD.noise; bp.type='highpass'; bp.frequency.value=6000;
    g.gain.setValueAtTime(0.05,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
    src.connect(bp); bp.connect(g); g.connect(bus); src.start(t); src.stop(t+0.06);
  }
}
function musicStart(){
  if(!AUD.music||AUD.playing) return;
  var c=audio(); if(!c) return;
  AUD.playing=true; AUD.next=c.currentTime+0.08;
  AUD.musicBus.gain.cancelScheduledValues(c.currentTime);
  AUD.musicBus.gain.setTargetAtTime(0.5,c.currentTime,0.6);
  AUD.timer=setInterval(function(){
    while(AUD.next<AUD.ctx.currentTime+0.15){scheduleStep(AUD.step,AUD.next);AUD.step++;AUD.next+=STEP;}
  },30);
}
function musicStop(){
  if(!AUD.playing) return;
  AUD.playing=false; clearInterval(AUD.timer);
  var c=AUD.ctx; AUD.musicBus.gain.cancelScheduledValues(c.currentTime);
  AUD.musicBus.gain.setTargetAtTime(0,c.currentTime,0.25);
}
function sfxSnap(){
  if(!AUD.sfx) return; var c=audio(); if(!c) return; var t=c.currentTime;
  var src=c.createBufferSource(),bp=c.createBiquadFilter(),g=c.createGain();
  src.buffer=AUD.noise; bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=2.5;
  g.gain.setValueAtTime(0.6,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  src.connect(bp); bp.connect(g); g.connect(AUD.sfxBus); src.start(t); src.stop(t+0.06);
  var o=c.createOscillator(),g2=c.createGain(); o.type='square';
  o.frequency.setValueAtTime(1500,t); o.frequency.exponentialRampToValueAtTime(420,t+0.035);
  g2.gain.setValueAtTime(0.12,t); g2.gain.exponentialRampToValueAtTime(0.0001,t+0.04);
  o.connect(g2); g2.connect(AUD.sfxBus); o.start(t); o.stop(t+0.05);
}
function sfxReward(){
  if(!AUD.sfx) return; var c=audio(); if(!c) return; var t=c.currentTime+0.02;
  [72,76,79,84,88].forEach(function(m,i){tone(AUD.sfxBus,mtof(m),t+i*0.09,0.5,'triangle',0.25);});
  tone(AUD.sfxBus,mtof(96),t+0.5,0.8,'sine',0.12);
}

function loadThree(cb){

  s.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
  s.onload=cb;

  document.head.appendChild(s);
}

function resetView(first,animate){

    var from={}; for(var k in to) from[k]=G.view[k];
    var d=to.az-from.az; d=Math.atan2(Math.sin(d),Math.cos(d)); to.az=from.az+d;   /* หมุนทางที่สั้นกว่า */

function stepTween(){

  var k=Math.min(1,(performance.now()-w.t0)/w.dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;

function bindControls(el){
  var pts={},last=0;
  el.addEventListener('pointerdown',function(e){pts[e.pointerId]={x:e.clientX,y:e.clientY};try{el.setPointerCapture(e.pointerId);}catch(_){}});
  el.addEventListener('pointermove',function(e){
    var p=pts[e.pointerId]; if(!p) return; var ids=Object.keys(pts);
    if(ids.length===1){ G.view.az-=(e.clientX-p.x)*0.008; if(e.pointerType==='mouse') G.view.pol=Math.max(0.45,Math.min(1.35,G.view.pol-(e.clientY-p.y)*0.006)); }
    else if(ids.length===2){ var o=pts[ids[0]==e.pointerId?ids[1]:ids[0]]; var d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y); if(d0>0) G.view.rad=Math.max(16,Math.min(75,G.view.rad*d0/d1)); }
    pts[e.pointerId]={x:e.clientX,y:e.clientY}; G.tween=null; applyView(); if(!G.viewDirty) setViewDirty(true);
  });
  function up(e){delete pts[e.pointerId];}
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',function(e){e.preventDefault();G.tween=null;G.view.rad=Math.max(16,Math.min(75,G.view.rad*(1+e.deltaY*0.001)));applyView();if(!G.viewDirty) setViewDirty(true);},{passive:false});

function hwStats(){var meshes=0,casters=0;G.scene.traverse(function(o){if(o.isMesh){meshes++;if(o.castShadow)casters++;}});return {meshes:meshes,casters:casters,calls:G.renderer.info.render.calls,triangles:G.renderer.info.render.triangles,studs:G.studCount};}

/* ================= ตัวควบคุมหน้าจอ ================= */
function go(name){
  if(!SCREENS[name]) return;
  if(ST.listening) ST.listening.stop();
  if(ST.screen==='highway'&&name!=='highway') destroyHighway();
  var changed=ST.screen!==name; ST.screen=name;
  if(changed) stopSpeak();   /* ไม่ให้เสียงพูดจากหน้าก่อนดังค้าง */
  main.innerHTML=SCREENS[name]();
  if(name==='today'){ ST.sh=null; ST.ls=null; }
  if(name==='today') initToday();
  if(name==='highway') initHighway();
  if(name==='talk') initTalk();
  if(name==='explain') initExplain();
  document.getElementById('tabs').hidden=(name==='guide');
  document.querySelectorAll('nav.tabs button').forEach(function(b){
    if(b.dataset.go===name) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  if(changed) window.scrollTo(0,0);   /* เลื่อนขึ้นบนสุดเฉพาะตอนเปลี่ยนหน้าจริง */
}

/* จับเหตุการณ์คลิกทั้งแอป (event delegation) — อัปเดต DOM เฉพาะจุด ไม่วาดใหม่ทั้งหน้า */
document.addEventListener('click',function(e){
  var t=e.target.closest('button'); if(!t) return;
  try{
    if(t.dataset.go){go(t.dataset.go); return;}
    if(t.dataset.speak){ if(ST.speakBtn===t){ stopSpeak(); return; } speak(t.dataset.speak,t.dataset.who,t); return; }
    if(t.dataset.act==='diagnose'){runDiagnose(t); return;}
    if(t.dataset.act==='level'){ setLevel(t); return; }
    if(t.dataset.act==='lang'){ setLang(t.dataset.lang); return; }
    if(t.dataset.act==='thRetry'){ ensureThai(true); renderKnow(false); return; }
    if(t.dataset.act==='shNav'){ ST.sh.i=Math.max(0,Math.min(ST.sh.list.length-1,ST.sh.i+(+t.dataset.d))); document.getElementById('shadow').innerHTML=shadowHTML();
      var nb=document.querySelector('#shadow [data-act="shNav"][data-d="'+t.dataset.d+'"]'); if(nb&&!nb.disabled) nb.focus({preventScroll:true}); else document.getElementById('shIn').focus({preventScroll:true}); return; }
    if(t.id==='shCheck'){ shadowCheck(); return; }
    if(t.id==='lsOpen'){ var lb=document.getElementById('listen'), open=lb.hidden; lb.hidden=!open; t.setAttribute('aria-expanded',open); if(open) lsRender(); else stopSpeak(); return; }
    if(t.id==='lsPlay'){ if(ST.ls.playing){ stopSpeak(); } else lsPlayFrom(ST.ls.i>=ST.ls.tracks.length?0:ST.ls.i); return; }
    if(t.dataset.act==='lsNav'){ var ni=Math.max(0,Math.min(ST.ls.tracks.length-1,ST.ls.i+(+t.dataset.d))); if(ST.ls.playing) lsPlayFrom(ni); else { ST.ls.i=ni; lsUI(); } return; }
    if(t.dataset.act==='talkMode'){ var em=t.dataset.m==='email';
      document.querySelectorAll('[data-act="talkMode"]').forEach(function(b){b.setAttribute('aria-pressed',b===t);});
      document.getElementById('talkPane').hidden=em; document.getElementById('emailPane').hidden=!em; if(em) emailOpen(); stopSpeak(); return; }
    if(t.id==='emBtn'){ emailScore(); return; }
    if(t.id==='emModel'){ var mb=document.getElementById('emModelBox'); mb.hidden=!mb.hidden; t.setAttribute('aria-expanded',!mb.hidden); return; }
    if(t.dataset.act==='reshuffle'){   /* วาดใหม่เฉพาะแผงควิซ · XP นับครั้งแรกของวันเท่านั้น */
      var pn=document.getElementById(t.dataset.panel==='chk'?'chkPanel':'qzPanel'); if(!pn) return;
      pn.innerHTML=t.dataset.panel==='chk'?chkPanelHTML(curTopic().activity):qzPanelHTML();
      var first=pn.querySelector('.opt'); if(first) first.focus({preventScroll:true});
      return;
    }
    if(t.dataset.act==='tapMode'){
      ST.tapMode=!ST.tapMode; t.setAttribute('aria-pressed',ST.tapMode); t.textContent=ST.tapMode?'แตะคำเพื่อเก็บ: เปิด':'แตะคำเพื่อเก็บ: ปิด';
      var sp=document.getElementById('sumText'); if(sp) sp.innerHTML=sumHTML(curSummary());
      var hn=document.getElementById('tapHint');
      if(ST.tapMode&&!hn) t.parentNode.insertAdjacentHTML('afterend','<p class="demo-note" id="tapHint">แตะคำที่ขีดเส้นประเพื่อเก็บเข้าคลังศัพท์ (ความหมายจากอภิธานศัพท์กลาง หรือโค้ช AI)</p>');
      if(!ST.tapMode&&hn) hn.remove();
      return;
    }
    if(t.dataset.mk){
      var li=t.closest('li'); t.disabled=true;
      google.script.run.withSuccessHandler(function(){ if(PROG) PROG.mistakes=PROG.mistakes.filter(function(m){return String(m.row)!==t.dataset.mk;}); li.remove();
          var mk=document.getElementById('mistakes'); if(mk&&!mk.querySelector('li')) mk.innerHTML=mistakeBookHTML(); })
        .withFailureHandler(function(e){ t.disabled=false; toast(e&&e.message?e.message:String(e),true); })
        .seResolveMistake(+t.dataset.mk);
      return;
    }
    if(t.dataset.act==='to2d'||t.id==='hwMode'){ ST.mode2d=t.id==='hwMode'?!ST.mode2d:true; savePref('se_2d',ST.mode2d); destroyHighway(); ST.screen=null; go('highway'); return; }
    if(t.dataset.act==='reloadTopic'){loadTodayTopic(); ST.screen=null; go('today'); return;}
    if(t.dataset.act==='nextTopic'){TODAY_IDX=(TODAY_IDX+1)%TOPICS.length; ST.screen=null; go('today'); return;}
    if(t.dataset.act==='slow'){
      ST.slow=!ST.slow; t.setAttribute('aria-pressed',ST.slow); t.textContent=ST.slow?'เสียงพูดช้า: เปิด':'เสียงพูดช้า: ปิด'; return;
    }
    if(t.dataset.q){ /* ตอบคำถาม */
      var id=t.dataset.q, box=document.getElementById(id);
      if(box.dataset.done) return;
      var src=id.indexOf('chk')===0?curTopic().activity.checks[+id.slice(3)]:QUIZ[+id.slice(2)];
      var pick=+t.dataset.i;
      box.querySelector('.opt[data-i="'+src.a+'"]').classList.add('right');   /* ตัวเลือกถูกสลับตำแหน่ง → หาจากลำดับจริง */
      if(pick!==src.a) t.classList.add('wrong'); else addXP(10);
      box.dataset.done='1'; if(pick===src.a) box.dataset.ok='1';
      var pre=id.indexOf('chk')===0?'chk':'qz', boxes=document.querySelectorAll('.q[id^="'+pre+'"]');
      var all=[].every.call(boxes,function(b){return b.dataset.done;}), okN=[].filter.call(boxes,function(b){return b.dataset.ok;}).length;
      if(all) recordTask(pre==='chk'?'today':'review',{xp:10*okN,quizCorrect:okN});
      var ex=box.querySelector('.explain'); ex.hidden=false; ex.textContent=(pick===src.a?'ถูกต้อง +10 XP · ':'ยังไม่ถูก · ')+src.why;
      return;
    }
    if(t.dataset.deck&&IN_GAS){ /* ทวนศัพท์ (บันทึกลงชีต) */
      var di=+t.dataset.deck, w=deckList()&&deckList()[di], pair=t.parentNode.querySelectorAll('[data-deck]'), dueEl=document.getElementById('due'+di);
      if(!w) return;
      [].forEach.call(pair,function(b){b.disabled=true; b.setAttribute('aria-pressed',b===t);});
      dueEl.textContent='กำลังบันทึก…';
      google.script.run
        .withSuccessHandler(function(r){ dueEl.textContent='ทวนครั้งถัดไป: อีก '+r.days+' วัน (กล่อง '+r.box+')'; })
        .withFailureHandler(function(e){ [].forEach.call(pair,function(b){b.disabled=false;b.setAttribute('aria-pressed','false');}); dueEl.textContent='บันทึกไม่สำเร็จ — ลองกดอีกครั้ง'; toast(e&&e.message?e.message:String(e),true); })
        .seReviewVocab(localYmd(),w.en,t.dataset.v);
      return;
    }
    if(t.dataset.deck){ /* ทวนศัพท์ */
      var i=t.dataset.deck;
      t.parentNode.querySelectorAll('[data-deck]').forEach(function(b){b.setAttribute('aria-pressed',b===t);});
      document.getElementById('due'+i).textContent=t.dataset.v==='ok'?'ทวนครั้งถัดไป: อีก 3 วัน':'ทวนครั้งถัดไป: พรุ่งนี้';
      return;
    }
  }catch(err){console.error('click handler error',err);}
});
